name: Publish website to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - index.html
      - Fotos/victoria-oyarzun-campana.jpg
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare website files
        run: |
          mkdir -p _site/Fotos
          cp index.html _site/
          cp "WhatsApp Image 2026-11-04 at 16.48.29 (1).jpeg" _site/
          cp Fotos/victoria-oyarzun-campana.jpg _site/Fotos/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
